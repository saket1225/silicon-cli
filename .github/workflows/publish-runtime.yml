name: Publish Silicon Runtime

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/publish-runtime.yml"
      - "docker/runtime/**"
      - "pyproject.toml"
      - "silicon_cli/**"
  workflow_dispatch:
    inputs:
      promote_latest:
        description: Promote this exact commit image to the mutable latest tag
        required: true
        type: boolean
        default: false

permissions:
  contents: read
  packages: write

concurrency:
  group: silicon-runtime-publish
  cancel-in-progress: false

env:
  IMAGE_NAME: ghcr.io/teamofsilicons/silicon-runtime

jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0
        with:
          image: tonistiigi/binfmt@sha256:400a4873b838d1b89194d982c45e5fb3cda4593fbfd7e08a02e76b03b21166f0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
        with:
          version: v0.35.0
          driver-opts: image=moby/buildkit@sha256:2f5adac4ecd194d9f8c10b7b5d7bceb5186853db1b26e5abd3a657af0b7e26ec

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve runtime contract
        id: contract
        run: |
          echo "sha256=$(python -c 'from silicon_cli.runtime_contract import docker_contract_sha256; print(docker_contract_sha256())')" >> "$GITHUB_OUTPUT"

      - name: Build and push runtime image
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: docker/runtime/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            SILICON_CLI_SPEC=git+https://github.com/${{ github.repository }}.git@${{ github.sha }}
            RUNTIME_CONTRACT_SHA256=${{ steps.contract.outputs.sha256 }}
          tags: |
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify the pushed runtime before promotion
        env:
          IMAGE_REF: ${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}
          EXPECTED_CONTRACT_SHA256: ${{ steps.contract.outputs.sha256 }}
        run: |
          docker pull "$IMAGE_REF"
          actual_label="$(docker image inspect \
            --format '{{index .Config.Labels "io.teamofsilicons.runtime-contract-sha256"}}' \
            "$IMAGE_REF")"
          test "$actual_label" = "$EXPECTED_CONTRACT_SHA256"
          probe_script="$(python -c 'from silicon_cli.runtime_contract import DOCKER_PROBE_SCRIPT; print(DOCKER_PROBE_SCRIPT)')"
          contract_json="$(python -c 'from silicon_cli.runtime_contract import docker_contract_json; print(docker_contract_json())')"
          docker run --rm --pull never \
            --entrypoint /opt/silicon-runtime/bin/python \
            "$IMAGE_REF" -I -c "$probe_script" "$contract_json"

      - name: Explicitly promote this commit to latest
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.promote_latest }}
        run: |
          docker buildx imagetools create \
            --tag "${IMAGE_NAME}:latest" \
            "${IMAGE_NAME}@${{ steps.build.outputs.digest }}"
